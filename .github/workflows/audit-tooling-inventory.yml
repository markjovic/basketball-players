# .github/workflows/audit-tooling-inventory.yml
name: Audit Tooling Inventory

# Inventories scripts/ and .github/workflows/ and classifies every file, so a
# deletion list is agreed FROM EVIDENCE rather than from memory.
#
# It deletes NOTHING. Deletion stays with cleanup-repo.yml, which already has the
# dry run, the pre-cleanup recovery tag and the ordering gates. This writes a
# paste-ready list for those arrays.
#
# WHY. 163 workflow files, 37 added or amended in seven days. Each question gets
# its own script and workflow, they ship as a pair, and nothing is ever retired.
# A one-question diagnostic should be deleted in the same commit that records its
# answer — this finds the ones where that never happened.
#
# TWO LISTS, KEPT SEPARATE ON PURPOSE:
#   SAFE           — nothing references it AND a document already records what it
#                    found. Deleting it loses nothing.
#   DOCUMENT FIRST — nothing references it and NO document mentions it. Deleting
#                    it silently discards whatever it established. Write the
#                    finding down, add the name to TOOLING.md §2.4, then move the
#                    line to SAFE.
#
# Reference detection is deliberately GENEROUS: a script counts as used if ANY
# workflow mentions its filename anywhere, not only in an explicit invocation line.
# (This note used to contain a literal example path. The matcher read it out of the
# prose and reported THIS workflow as PARTLY BROKEN, calling a script that has never
# existed — a detector that matches paths must not be documented using a path.)
# Over-counting leaves a dead file in the repo; under-counting puts a LIVE file on
# a delete list. Those costs are not symmetrical.
#
# CHECKOUT. `git log` on a depth-1 checkout returns nothing, so dates need full
# history. This uses the blobless sparse checkout cleanup-repo.yml already uses
# for the same reason — no player or game blobs. If history is unavailable dates
# report null and no classification depends on them.
#
# ⚠️ TOOLING.md MUST BE IN THIS LIST. It is the classifier's primary source, and it was
# missing from the sparse checkout on 2026-09-10 — the file was committed to the repo and
# the job simply never checked it out, so the script reported it absent and fell back to
# REPO_MANIFEST.md. A file present in the repository is not present in the working tree
# unless a sparse pattern names it.
#
# DONE 2026-09-11: the other documents were removed from the repo and their lines are
# now deleted from here, as this comment instructed. TOOLING.md is the ONLY source the
# classifier reads. Do not add a document back to this list without also making the
# script read it — a sparse pattern naming a file nothing opens is pure misdirection.
#
# ⚠️ THE DOCUMENTS ARE NAMED ONE BY ONE, NOT MATCHED BY `/*.md`. 2026-09-10: the
# pattern was `/*.md` and NOTHING matched, so REPO_MANIFEST.md was absent and every
# file in the repository read as UNDOCUMENTED. That is not a cosmetic column — the
# SAFE list requires a document to already record what a script found, so the run
# reported "0 safe to delete" and the whole safe-versus-document-first split was
# inert. A leading-slash glob does not behave as expected in non-cone mode; naming
# the files is unambiguous.
#
# The `documented` test no longer reads any document. It is TOOLING.md §2.4/§3.4
# membership and nothing else — the three documents it used to scan left the repo on
# 2026-09-11, which made the test permanently false and every script read UNDOCUMENTED.
# §2.4 is the assertion "concluded, and the finding is written down outside this repo",
# which keeps the marker in the repo while the finding itself does not have to be.
#
# No network. No setup-node needed (nothing here fetches api.playhq.com either).

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Recent window in days'
        required: false
        default: '14'
        type: string
      commit:
        description: 'Commit the reports'
        required: false
        default: true
        type: boolean

concurrency:
  group: tooling-inventory
  cancel-in-progress: false

permissions:
  contents: write
  # ⚠️ actions: read IS LOAD-BEARING. The script asks GitHub when each workflow last
  # actually RAN, and that is the only signal that cannot be wrong about how a
  # workflow is triggered. Three attempts to infer it from structure gave three
  # different wrong answers — including calling deploy-pages.yml spent, which is the
  # only thing that publishes the data, and cleanup-repo.yml spent, which is the
  # deletion tool itself. Without this permission the run history is empty and the
  # verdicts silently fall back to that same failed inference.
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (blobless full history, sparse to scripts + workflows + docs)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            scripts
            .github/workflows
            reports
            TOOLING.md
          sparse-checkout-cone-mode: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Confirm TOOLING.md is actually present
        # It is the ONLY classification source. Without it every file is judged on age
        # and reference-counting alone, and a run that reports nothing to delete because
        # it could not read the list looks identical to one that found nothing.
        # This FAILS rather than warns: the old version printed a warning and carried on,
        # which is how a meaningless run gets read as a clean one.
        run: |
          set -euo pipefail
          if [ ! -f TOOLING.md ]; then
            echo "TOOLING.md is not in the working tree."
            echo "Either it is missing from the sparse-checkout list above, or it is not"
            echo "committed. A file present in the repository is NOT present in the working"
            echo "tree unless a sparse pattern names it — that exact fault produced a whole"
            echo "run of false UNDOCUMENTED verdicts on 2026-09-10."
            exit 1
          fi
          echo "  present: TOOLING.md  ($(grep -c '^- `' TOOLING.md) classified rows)"

      - name: Syntax check
        run: node --check scripts/audit-tooling-inventory.js

      # Inputs go through env, never straight onto the command line — GitHub
      # substitutes them before bash sees them, so anything in one becomes shell
      # source text.
      - name: Audit tooling inventory
        env:
          IN_DAYS:   ${{ inputs.days || '14' }}
          IN_COMMIT: ${{ inputs.commit }}
          # gh needs a token for the run-history queries.
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="--days=$IN_DAYS"
          if [ "$IN_COMMIT" = "true" ] || [ "$IN_COMMIT" = "True" ]; then ARGS="$ARGS --commit"; fi
          node scripts/audit-tooling-inventory.js $ARGS
