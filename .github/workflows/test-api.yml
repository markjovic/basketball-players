# .github/workflows/test-api.yml
name: Test API

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: concurrency | profile | game | schema | gps | fixture'
        required: true
        default: 'fixture'
        type: string
      args:
        description: 'Args, e.g. --grade=<gradeId> (or a uuid/gameId for profile/game)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # NO actions/setup-node — this job fetches PlayHQ, and setup-node's fingerprint
      # change makes CloudFront 403-block every request including session acquisition
      # (proven 2026-07-20 on the instrumented matrix shard 00; same-day nightly-crawl
      # without setup-node worked). Preinstalled node only.
      - name: Run test-api
        run: node scripts/test-api.js ${{ inputs.mode }} ${{ inputs.args }}
