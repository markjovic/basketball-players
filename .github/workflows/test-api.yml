# .github/workflows/test-api.yml
name: Test API

on:
  workflow_dispatch:
    inputs:
      mode:
        # DEFAULT CHANGED 2026-09-11 from 'fixture' to 'concurrency'. 'fixture'
        # REQUIRES --grade, and args defaults to empty, so a bare dispatch always
        # exited 1 on the usage banner without ever calling PlayHQ. 'concurrency'
        # is the only mode that needs no argument, and it acquires a session first,
        # which makes it the cheapest check that PlayHQ is reachable at all.
        description: 'Mode. concurrency needs no args. profile/game/gps need one. schema and fixture take --grade='
        required: true
        default: 'concurrency'
        type: choice
        options: ['concurrency', 'profile', 'game', 'schema', 'gps', 'fixture']
      args:
        description: 'Required for profile <uuid>, game <gameId>, gps <gradeId>, fixture --grade=<id>. Leave blank for concurrency.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # NO actions/setup-node — this job fetches PlayHQ, and setup-node's fingerprint
      # change makes CloudFront 403-block every request including session acquisition
      # (proven 2026-07-20 on the instrumented matrix shard 00; same-day nightly-crawl
      # without setup-node worked). Preinstalled node only.
      - name: Run test-api
        run: node scripts/test-api.js ${{ inputs.mode }} ${{ inputs.args }}
