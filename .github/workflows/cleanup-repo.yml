# .github/workflows/cleanup-repo.yml
name: Cleanup Repo

# Uses the GitHub Git Data API. NO CHECKOUT, NO GIT COMMAND — do not reintroduce
# either. The clone-based version could not work at this repo's size: with
# fetch-depth 1 and filter: blob:none, `git push` of a tag at the shallow boundary
# and `git merge -X ours FETCH_HEAD` both make git enumerate objects, and under
# blob:none enumerating means backfilling every blob across 418,000 player files.
# One ran past ten minutes, the other three, both cancelled 2026-09-11.
#
# It reads the tree entries for the directories it touches, builds one new tree
# with the listed paths removed, commits against the current head and moves the
# ref. Directory reads are NON-recursive, one call each: the recursive endpoint
# truncates at 100,000 entries here and would silently under-report.
#
# SAFETY. The pre-cleanup tag is created at the OLD head before the ref moves, and
# the ref update is a non-forced PATCH, so if main advanced mid-run it is rejected
# and nothing changes.
#
# DRY RUN FIRST. dry_run=true resolves and lists every deletion, writes nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list every deletion, change NOTHING (run this FIRST)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete stale files
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: pre-cleanup-${{ github.run_id }}
        run: |
          set -euo pipefail

          # ── Individual files ────────────────────────────────────────────────
          # 2026-09-11 reports pass. Each entry is justified by what the files
          # themselves record, NOT by the "not on keep-list" flag in db-audit
          # §11b — that flag is membership in a hardcoded list and it also flags
          # manual-alias-decisions.json and tooling-inventory.json.
          #
          # wrongly-keyed-census-progress.json (72 MB) is the ABANDONED
          #   single-runner attempt: 36 done, 18 wrong, out of 418,250 candidates.
          #   The matrix superseded it and finished — wrongly-keyed-census.json
          #   records complete=true, shardsMissing=[], 1,532 wrong, merged and
          #   retested 2026-08-30. That output stays. This does not.
          # The five orphans below have no referencing script left, either because
          #   it was deleted on 2026-09-11 or because nothing ever referenced them.
          # zero-team-seasons.json was on the July cleanup list and never removed.
          # scripts/fold-diverged-players.yml is a workflow sitting in scripts/.
          #   The real one, .github/workflows/fold-diverged-players.yml, is live
          #   and is not touched. If this path turns out not to exist the dry run
          #   reports it absent and nothing happens.
          # 2026-09-11, stray-file pass. `.github/workflows/` executes only .yml,
          # so a .js sitting there is dead weight that can never run. Confirmed
          # against the repo: these two plus discover-seasons.yml.txt are the only
          # non-.yml entries in that directory. scan-roster-id-forms.js is NOT in
          # the repo — it existed only in the local export.
          #
          # diagnose-nameless-players.js is byte-identical to the script deleted on
          #   2026-09-11; this is the last surviving copy of a deliberate deletion.
          # build-alias-worklist.js is a 9,479-byte older copy of the live
          #   scripts/build-alias-worklist.js (10,795 bytes). A stale duplicate of a
          #   kept script is the one that eventually gets edited by mistake.
          #
          # discover-seasons.yml.txt is DELIBERATELY NOT HERE. It is not junk — it
          # is the staged fix removing actions/setup-node from discover-seasons.yml,
          # which on main still carries it. Delete it only after that fix is
          # committed, or the correction goes and the defect stays.
          cat > /tmp/paths.txt <<'PATHS'
          .github/workflows/build-alias-worklist.js
          .github/workflows/diagnose-nameless-players.js
          PATHS

          # ── Whole directories ───────────────────────────────────────────────
          # Every blob directly inside each, read non-recursively. EMPTY this pass:
          # explore-results/ and roster-results/ went in pass two, and the dry run
          # on 2026-09-11 confirmed both are absent from the tree.
          cat > /tmp/dirs.txt <<'DIRS'
          DIRS

          sed -i 's/^[[:space:]]*//;/^$/d' /tmp/paths.txt
          sed -i 's/^[[:space:]]*//;/^$/d' /tmp/dirs.txt

          echo "=== $([ "$DRY_RUN" = "true" ] && echo "DRY RUN — nothing will be changed" || echo "LIVE RUN") ==="
          echo ""

          if [ ! -s /tmp/paths.txt ] && [ ! -s /tmp/dirs.txt ]; then
            echo "Nothing configured — no paths and no directories."
            exit 0
          fi

          SHA=$(gh api "repos/$REPO/git/ref/heads/main" | jq -r '.object.sha')
          ROOT_TREE=$(gh api "repos/$REPO/git/commits/$SHA" | jq -r '.tree.sha')
          echo "main head:  $SHA"
          echo "root tree:  $ROOT_TREE"
          echo ""

          # `gh api --jq` takes exactly ONE argument, the query. It does not accept
          # jq's own flags — passing --arg to it gave "accepts 1 arg(s), received 4"
          # and failed a run on 2026-09-11. Pipe into real jq instead.
          subtree() {  # subtree <parent-tree-sha> <name> -> sha, empty if absent
            gh api "repos/$REPO/git/trees/$1" \
              | jq -r --arg n "$2" '.tree[] | select(.path==$n and .type=="tree") | .sha'
          }
          resolve_tree() {  # resolve_tree <a/b/c> -> sha, empty if any segment absent
            local cur="$ROOT_TREE" seg
            local IFS='/'
            for seg in $1; do
              [ -z "$seg" ] && continue
              cur=$(subtree "$cur" "$seg")
              [ -z "$cur" ] && { printf ''; return; }
            done
            printf '%s' "$cur"
          }

          # Directories whose tree we must read: the parent of every listed file,
          # plus every directory being emptied. Derived, not hardcoded.
          : > /tmp/needed.txt
          while read -r p; do
            case "$p" in */*) echo "${p%/*}" ;; *) echo "" ;; esac
          done < /tmp/paths.txt >> /tmp/needed.txt
          cat /tmp/dirs.txt >> /tmp/needed.txt
          sort -u -o /tmp/needed.txt /tmp/needed.txt

          : > /tmp/modes.tsv
          while read -r d; do
            if [ -z "$d" ]; then
              t="$ROOT_TREE"; pfx=""
            else
              t=$(resolve_tree "$d")
              if [ -z "$t" ]; then echo "  note: directory not in tree — $d"; continue; fi
              pfx="$d/"
            fi
            gh api "repos/$REPO/git/trees/$t" \
              | jq -r --arg p "$pfx" '.tree[] | select(.type=="blob") | "\($p)\(.path)\t\(.mode)"' \
              >> /tmp/modes.tsv
          done < /tmp/needed.txt
          echo "tree entries read: $(wc -l < /tmp/modes.tsv)"

          # Expand each directory into its files, appended to the target list.
          while read -r d; do
            n=$(awk -F'\t' -v p="$d/" 'index($1,p)==1 {print $1}' /tmp/modes.tsv | tee -a /tmp/paths.txt | wc -l)
            echo "  $d/ expands to $n file(s)"
          done < /tmp/dirs.txt
          echo ""

          # ── Match each target against the tree ──────────────────────────────
          : > /tmp/todelete.tsv
          deleted=0; skipped=0
          while read -r p; do
            mode=$(awk -F'\t' -v t="$p" '$1==t {print $2; exit}' /tmp/modes.tsv)
            if [ -n "$mode" ]; then
              printf '%s\t%s\n' "$p" "$mode" >> /tmp/todelete.tsv
              if [ "$DRY_RUN" = "true" ]; then echo "  would rm: $p"; else echo "  rm: $p"; fi
              deleted=$((deleted+1))
            else
              echo "  skip (absent): $p"; skipped=$((skipped+1))
            fi
          done < /tmp/paths.txt

          BYTES=$(awk -F'\t' '{print $1}' /tmp/todelete.tsv | wc -l)
          echo ""
          echo "=== Summary ==="
          echo "  To delete: $deleted   Already absent: $skipped"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY RUN complete — nothing changed."
            echo "Re-run with dry_run=false to apply."
            exit 0
          fi

          if [ "$deleted" -eq 0 ]; then
            echo ""
            echo "NOTHING MATCHED. Every listed path is already absent — the list is stale."
            exit 1
          fi

          # ── Tag the pre-cleanup state, at the OLD head, before anything moves ─
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo ""
            echo "Tag $TAG already exists — reusing it."
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo ""
            echo "Tagged pre-cleanup state as: $TAG"
          fi
          echo "TO RECOVER ANY DELETED FILE LATER:"
          echo "  GitHub -> Code -> the tag dropdown -> select $TAG -> open the file -> Raw -> copy,"
          echo "  or restore-deleted-file.yml with the path (it reads from history)."

          # ── One tree, one commit, one ref move ──────────────────────────────
          awk -F'\t' '{printf "{\"path\":\"%s\",\"mode\":\"%s\",\"type\":\"blob\",\"sha\":null}\n",$1,$2}' \
            /tmp/todelete.tsv | jq -s --arg bt "$ROOT_TREE" '{base_tree:$bt, tree:.}' > /tmp/tree.json

          NEW_TREE=$(gh api --method POST "repos/$REPO/git/trees" --input /tmp/tree.json | jq -r '.sha')
          echo ""
          echo "new tree:   $NEW_TREE"

          NEW_COMMIT=$(gh api --method POST "repos/$REPO/git/commits" \
            -f message="chore: delete the two stray .js files from .github/workflows" \
            -f tree="$NEW_TREE" \
            -f "parents[]=$SHA" | jq -r '.sha')
          echo "new commit: $NEW_COMMIT"

          if gh api --method PATCH "repos/$REPO/git/refs/heads/main" \
               -f sha="$NEW_COMMIT" -F force=false >/dev/null; then
            echo ""
            echo "main moved to $NEW_COMMIT — $deleted paths deleted."
          else
            echo ""
            echo "REF UPDATE REJECTED. main advanced since this run read it at $SHA."
            echo "Nothing was deleted. Re-dispatch the workflow."
            exit 1
          fi
