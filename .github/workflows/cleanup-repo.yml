# .github/workflows/cleanup-repo.yml
name: Cleanup Repo

# REWRITTEN 2026-09-11 to use the GitHub Git Data API instead of a git clone.
#
# WHY. The previous version checked the repo out with fetch-depth 1 and
# filter: blob:none, then performed five remote or object-hungry git operations
# on top of it. Three of them cannot work at this repository's size:
#   - `git push origin refs/tags/...` at the shallow boundary commit. Git cannot
#     assume the remote holds that commit's tree, starts enumerating objects to
#     pack, and under blob:none enumerating means lazily backfilling every blob.
#     Ran past ten minutes, cancelled.
#   - `git fetch origin main` + `git merge -X ours FETCH_HEAD` before the
#     deletions. A depth-1 clone has no common ancestor, so the merge compares
#     whole trees and backfills the lot. Ran three minutes, cancelled.
#   - the same merge again inside the push retry loop.
# Patching them one at a time cost two dispatches. The class of fault is the
# clone itself: deleting a list of known paths does not need a working tree.
#
# WHAT THIS DOES INSTEAD. No checkout. It reads the tree entries for the three
# locations it touches, builds one new tree with those paths removed, commits it
# against the current head, and moves the ref. Five or six API calls, seconds,
# nothing packed and nothing fetched. Directory deletion is deliberately NOT
# supported here — every path below is a file, and a recursive tree read would
# be truncated at this repo's size. Add files individually.
#
# SAFETY. The pre-cleanup tag is created at the OLD head before the ref moves.
# The ref update is a non-forced PATCH, so if main advanced between the read and
# the write it is rejected and nothing changes.
#
# DRY RUN FIRST. dry_run=true resolves and lists every deletion, writes nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list every deletion, change NOTHING (run this FIRST)'
        required: false
        default: true
        type: boolean
      include_gated:
        description: 'STAGE 2: also delete ordering-gated paths. Empty this pass.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete stale files
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_GATED: ${{ inputs.include_gated }}
          TAG: pre-cleanup-${{ github.run_id }}
        run: |
          set -euo pipefail

          # ── STAGE 1 — always deleted ────────────────────────────────────────
          # CLEANUP_PLAN.md §3 — concluded probes, findings recorded.
          # CLEANUP_PLAN.md §5 — concluded work, superseded or documented.
          # CLEANUP_PLAN.md §2 — drop-stale-playercount, plus the four project
          #                      documents, which the classifier no longer reads.
          # CLEANUP_PLAN.md §7 — the twelve probes confirmed defunct on review.
          #                      build-alias-worklist, probe-squad-evidence and
          #                      rebuild-player-index are NOT here: all three are
          #                      kept and classified in TOOLING.md.
          cat > /tmp/paths.txt <<'PATHS'
          scripts/merge-phantom-profiles.js
          scripts/probe-absent-games.js
          scripts/probe-both-resolve.js
          scripts/probe-duplicate-profiles.js
          scripts/probe-grade-ladder.js
          scripts/probe-setup-node-fingerprint.js
          scripts/probe-shared-roster.js
          scripts/size-duplicate-profiles.js
          scripts/check-roster-freshness.js
          scripts/probe-missing-games.js
          scripts/redirect-exposure.js
          scripts/scan-season-name-contamination.js
          scripts/drop-stale-playercount.js
          scripts/diagnose-alias-conflicts.js
          scripts/diagnose-nameless-players.js
          scripts/probe-alias-stats.js
          scripts/probe-discover-teams.js
          scripts/probe-notfound.js
          scripts/probe-registrations.js
          scripts/probe-roster-sources.js
          scripts/probe-session-throwaway.js
          scripts/probe-stattrack-shapes.cjs
          scripts/probe-stattrack-shapes.js
          scripts/probe-wrong-rosters.js
          scripts/prove-player-files-intact.js
          scripts/size-locked-backfill.js
          .github/workflows/merge-phantom-profiles.yml
          .github/workflows/probe-absent-games.yml
          .github/workflows/probe-both-resolve.yml
          .github/workflows/probe-duplicate-profiles.yml
          .github/workflows/probe-grade-ladder.yml
          .github/workflows/probe-setup-node-fingerprint.yml
          .github/workflows/probe-shared-roster.yml
          .github/workflows/size-duplicate-profiles.yml
          .github/workflows/check-roster-freshness.yml
          .github/workflows/probe-missing-games.yml
          .github/workflows/redirect-exposure.yml
          .github/workflows/scan-season-name-contamination.yml
          .github/workflows/drop-stale-playercount.yml
          .github/workflows/backfill.yml
          .github/workflows/diagnose-alias-conflicts.yml
          .github/workflows/probe-alias-stats.yml
          .github/workflows/probe-discover-teams.yml
          .github/workflows/probe-notfound.yml
          .github/workflows/probe-registrations.yml
          .github/workflows/probe-roster-sources.yml
          .github/workflows/probe-stattrack-shapes.yml
          .github/workflows/probe-wrong-rosters.yml
          .github/workflows/prove-player-files-intact.yml
          .github/workflows/size-locked-backfill.yml
          REPO_MANIFEST.md
          claude_context.md
          OUTSTANDING_TASKS.md
          playhq_api_reference.md
          PATHS
          sed -i 's/^[[:space:]]*//' /tmp/paths.txt
          sed -i '/^$/d' /tmp/paths.txt

          # ── STAGE 2 — ordering-gated. Empty this pass: the three July gates
          #    (build-alias-index.js, fix-uuid-prefix-length.js,
          #    cleanup-dead-artifacts.js) no longer exist. Kept as the mechanism
          #    for the reports/ work, where a report must be read before it goes.
          : > /tmp/gated.txt

          if [ "$INCLUDE_GATED" = "true" ]; then
            cat /tmp/gated.txt >> /tmp/paths.txt
          fi

          echo "=== $([ "$DRY_RUN" = "true" ] && echo "DRY RUN — nothing will be changed" || echo "LIVE RUN") ==="
          echo ""

          # ── Resolve head, commit and the three trees we touch ───────────────
          # No recursive tree read: at 418,000 player files the recursive
          # endpoint truncates at 100,000 entries and would silently under-report.
          # Each directory is read on its own, which is exact.
          SHA=$(gh api "repos/$REPO/git/ref/heads/main" | jq -r '.object.sha')
          ROOT_TREE=$(gh api "repos/$REPO/git/commits/$SHA" | jq -r '.tree.sha')
          echo "main head:  $SHA"
          echo "root tree:  $ROOT_TREE"
          echo ""

          # NOTE: `gh api --jq` takes exactly ONE argument, the query. It does not
          # accept jq's own flags — passing `--arg n scripts` to it gave
          # "accepts 1 arg(s), received 4" and failed the run on 2026-09-11.
          # Everything below pipes gh's JSON into real jq instead, which does take
          # --arg, and uses one mechanism throughout rather than two.
          subtree() {  # subtree <parent-tree-sha> <name> -> sha, empty if absent
            gh api "repos/$REPO/git/trees/$1" \
              | jq -r --arg n "$2" '.tree[] | select(.path==$n and .type=="tree") | .sha'
          }

          : > /tmp/modes.tsv
          # root-level blobs
          gh api "repos/$REPO/git/trees/$ROOT_TREE" \
            | jq -r '.tree[] | select(.type=="blob") | "\(.path)\t\(.mode)"' >> /tmp/modes.tsv
          # scripts/
          SCRIPTS_TREE=$(subtree "$ROOT_TREE" "scripts")
          if [ -n "$SCRIPTS_TREE" ]; then
            gh api "repos/$REPO/git/trees/$SCRIPTS_TREE" \
              | jq -r '.tree[] | select(.type=="blob") | "scripts/\(.path)\t\(.mode)"' >> /tmp/modes.tsv
          fi
          # .github/workflows/
          GH_TREE=$(subtree "$ROOT_TREE" ".github")
          if [ -n "$GH_TREE" ]; then
            WF_TREE=$(subtree "$GH_TREE" "workflows")
            if [ -n "$WF_TREE" ]; then
              gh api "repos/$REPO/git/trees/$WF_TREE" \
                | jq -r '.tree[] | select(.type=="blob") | ".github/workflows/\(.path)\t\(.mode)"' >> /tmp/modes.tsv
            fi
          fi
          echo "tree entries read: $(wc -l < /tmp/modes.tsv)"
          echo ""

          # ── Match each target against the tree ──────────────────────────────
          : > /tmp/todelete.tsv
          deleted=0; skipped=0
          section=""
          while read -r p; do
            case "$p" in
              scripts/*)            s="scripts" ;;
              .github/workflows/*)  s="workflows" ;;
              *)                    s="root files" ;;
            esac
            if [ "$s" != "$section" ]; then echo "── $s ──"; section="$s"; fi
            mode=$(awk -F'\t' -v t="$p" '$1==t {print $2; exit}' /tmp/modes.tsv)
            if [ -n "$mode" ]; then
              printf '%s\t%s\n' "$p" "$mode" >> /tmp/todelete.tsv
              if [ "$DRY_RUN" = "true" ]; then echo "  would rm: $p"; else echo "  rm: $p"; fi
              deleted=$((deleted+1))
            else
              echo "  skip (absent): $p"; skipped=$((skipped+1))
            fi
          done < /tmp/paths.txt

          echo ""
          echo "=== Summary ==="
          echo "  To delete: $deleted   Already absent: $skipped"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY RUN complete — nothing changed."
            echo "Re-run with dry_run=false to apply."
            exit 0
          fi

          # A deletion run that matched nothing has failed, not succeeded. That is
          # the signature of a list of paths that no longer exist.
          if [ "$deleted" -eq 0 ]; then
            echo ""
            echo "NOTHING MATCHED. Every listed path is already absent — the list is stale."
            exit 1
          fi

          # ── Tag the pre-cleanup state, at the OLD head, before anything moves ─
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo ""
            echo "Tag $TAG already exists — reusing it."
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo ""
            echo "Tagged pre-cleanup state as: $TAG"
          fi
          echo "TO RECOVER ANY DELETED FILE LATER:"
          echo "  GitHub -> Code -> the tag dropdown -> select $TAG -> open the file -> Raw -> copy,"
          echo "  or restore-deleted-file.yml with the path (it reads from history)."

          # ── One tree, one commit, one ref move ──────────────────────────────
          awk -F'\t' '{printf "{\"path\":\"%s\",\"mode\":\"%s\",\"type\":\"blob\",\"sha\":null}\n",$1,$2}' \
            /tmp/todelete.tsv | jq -s --arg bt "$ROOT_TREE" '{base_tree:$bt, tree:.}' > /tmp/tree.json

          NEW_TREE=$(gh api --method POST "repos/$REPO/git/trees" --input /tmp/tree.json | jq -r '.sha')
          echo ""
          echo "new tree:   $NEW_TREE"

          NEW_COMMIT=$(gh api --method POST "repos/$REPO/git/commits" \
            -f message="chore: delete concluded probes, superseded tools and the four project documents" \
            -f tree="$NEW_TREE" \
            -f "parents[]=$SHA" | jq -r '.sha')
          echo "new commit: $NEW_COMMIT"

          # Non-forced: if main moved between the read above and now, this is
          # rejected and NOTHING changes. The commit and tree are orphaned objects
          # and harmless; re-dispatch starts cleanly from the new head.
          if gh api --method PATCH "repos/$REPO/git/refs/heads/main" \
               -f sha="$NEW_COMMIT" -F force=false >/dev/null; then
            echo ""
            echo "main moved to $NEW_COMMIT — $deleted paths deleted."
          else
            echo ""
            echo "REF UPDATE REJECTED. main advanced since this run read it at $SHA."
            echo "Nothing was deleted. Re-dispatch the workflow."
            exit 1
          fi
