# .github/workflows/drop-stale-playercount.yml
# ONE-OFF. DELETE THIS FILE AND scripts/drop-stale-playercount.js AFTER RUNNING.

name: Drop Stale playerCount (one-off)

# Removes the `playerCount` field from data/sports-index.json.
#
# WHY A WORKFLOW FOR ONE KEY. That file is about 4 MB and GitHub's web editor refuses
# anything over 1 MB, and this repository is operated entirely through the web UI —
# there is no console. So a one-line change to a large JSON file needs a run.
#
# WHY REMOVE RATHER THAN MAINTAIN. Nothing writes it. Every script and every document
# was searched on 2026-09-09 and no writer exists; the only mentions are notes saying
# it is stale. It read 369,428 against 417,971 actual player files. That is the same
# shape as data/venue-index.json, created once in June and never updated because no
# writer was ever built (T56). A number that looks maintained and is not is worse than
# no number. The real count is the key count of players/indexes/{00-ff}.json, which
# db-audit.js already reports.
#
# It removes ONE key and asserts it. Season count, locked count, removed count and the
# grade total are captured before and compared after; any drift aborts before commit.
#
# data-write: it writes sports-index.json, which discover-org-seasons,
# close-empty-seasons, lock-quiet-seasons and the matrix reduce also write. Every one
# of them uses `merge -X ours`, so two concurrent writers do not conflict — the second
# to push silently keeps its own copy and discards the other's changes. The lock is
# what prevents that; the push retry does not.
#
# No actions/setup-node: no network calls, and preinstalled node is what every other
# script here runs on.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = report what would change, write nothing. apply = remove it and commit.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    # Backstop above the push retry's worst case (60 attempts x up to 90s jitter plus
    # a git cycle each), never a budget for it — see T55.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            data
          sparse-checkout-cone-mode: true

      - name: Syntax check
        run: node --check scripts/drop-stale-playercount.js

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Read through an explicit fallback. This one is dispatch-only, but the habit is
      # what stopped the weekly season sweep silently defaulting for a month.
      - name: Drop playerCount
        env:
          IN_MODE: ${{ inputs.mode || 'dry-run' }}
        run: |
          set -euo pipefail
          if [ "$IN_MODE" = "dry-run" ]; then
            node scripts/drop-stale-playercount.js --dry-run
          else
            node scripts/drop-stale-playercount.js
          fi

      - name: Afterwards
        if: always()
        run: |
          echo "Once this has run with mode=apply, DELETE BOTH FILES:"
          echo "  scripts/drop-stale-playercount.js"
          echo "  .github/workflows/drop-stale-playercount.yml"
          echo ""
          echo "A one-off left in place becomes a tool nobody can account for, which is"
          echo "how reports/ accumulated 171 MB across 45 files nobody owns."
